<script>
/* ===== Shared storage: load from the server, save every change, handle conflicts =====
   Runs the app from #appSrc. Opened as a local file (or with ?local=1) the app keeps working
   exactly as before, saving only in this browser. Served from the web app, it loads the team's
   data from /api/state, then saves each change the app makes (catalog, settings, action items,
   each proposal) back to the server, recording who saved it. */
(function(){
  const SRC=document.getElementById("appSrc").textContent;
  const run=()=>{const s=document.createElement("script");s.textContent=SRC;document.body.appendChild(s)};
  const hosted=/^https?:$/.test(location.protocol)&&!/[?&]local=1\b/.test(location.search);
  if(!hosted){run();return}

  const K={catalog:"pl_catalog_v1",settings:"pl_settings_v1",actions:"pl_actions_v1",proposals:"pl_proposals_v1"};
  const DOC_OF={};Object.keys(K).forEach(n=>DOC_OF[K[n]]=n);
  const LABEL={catalog:"the service catalog",settings:"Settings",actions:"the action items"};
  const st={me:null,docs:{},props:{},local:{},dirty:new Set(),busy:false,again:false,timer:0,retry:0,conflicts:new Map(),errors:new Map(),waiters:[],remote:null,signedOut:false,reloadWanted:false};
  /* st.local holds what THIS tab's app last saved for each item. Saves are taken from here, not from
     localStorage, because other tabs of the same browser share localStorage and would mix their data in. */
  const origSet=Storage.prototype.setItem;
  const lsSet=(k,v)=>origSet.call(localStorage,k,v);
  const strip=p=>{const c=Object.assign({},p);delete c.savedBy;delete c.savedAt;return JSON.stringify(c)};
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const when=iso=>{if(!iso)return"";const d=new Date(iso);return d.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})};

  /* ---------- overlay while loading, or when the data can't be loaded ---------- */
  const ov=document.createElement("div");ov.id="plSyncOverlay";
  ov.style.cssText="position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(243,246,248,.96);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;color:#102B38";
  ov.innerHTML='<div style="text-align:center;max-width:460px;padding:24px"><div id="plSyncMsg">Loading PetroLedger data…</div><div id="plSyncAct" style="margin-top:14px"></div></div>';
  document.body.appendChild(ov);
  const fatal=(msg,btn)=>{document.getElementById("plSyncMsg").innerHTML=msg;document.getElementById("plSyncAct").innerHTML=`<button style="padding:8px 16px;border:0;border-radius:6px;background:#102B38;color:#fff;font:inherit;cursor:pointer" onclick="location.reload()">${btn||"Try again"}</button>`};

  /* ---------- save status in the top bar, and the notice bar for conflicts and updates ---------- */
  let pill,bar;
  function ui(){
    if(!pill){pill=document.createElement("div");pill.id="plSave";pill.setAttribute("role","status");pill.setAttribute("aria-live","polite");
      pill.style.cssText="font-size:12px;white-space:nowrap;padding:4px 10px;border-radius:12px;margin-left:12px;background:#EAF3EE;color:#1F5A3A";
      const who=document.getElementById("whoAmI");who&&who.parentNode?who.parentNode.insertBefore(pill,who):document.querySelector(".topbar")?.appendChild(pill)}
    if(!bar){bar=document.createElement("div");bar.id="plNotice";bar.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(760px,94vw);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif";document.body.appendChild(bar)}
  }
  function status(){
    ui();
    const n=st.dirty.size+(st.busy?1:0);
    let t="Saved",tip="All changes are saved for the team",bg="#EAF3EE",fg="#1F5A3A";
    if(st.signedOut){t="Signed out";tip="Sign-in expired — changes are not being saved";bg="#FBECEC";fg="#990000"}
    else if(st.errors.size){t="Not saved";tip="A change was refused by the server";bg="#FBECEC";fg="#990000"}
    else if(st.conflicts.size){t="Decision needed";tip="Someone else changed an item you edited — choose a version below";bg="#FCF1E7";fg="#8A4A12"}
    else if(st.retry){t="Not saved";tip="The server can't be reached — retrying";bg="#FBECEC";fg="#990000"}
    else if(n){t="Saving…";tip="Saving your changes";bg="#F3F6F8";fg="#3B4A52"}
    pill.textContent=t;pill.title=tip;pill.dataset.state=t;pill.style.background=bg;pill.style.color=fg;
    renderBar();
  }
  const btn=(label,act,primary)=>`<button data-act="${esc(act)}" style="padding:6px 12px;border-radius:6px;border:1px solid ${primary?"#102B38":"#C9D3D8"};background:${primary?"#102B38":"#fff"};color:${primary?"#fff":"#102B38"};font:inherit;cursor:pointer;white-space:nowrap">${label}</button>`;
  const card=(html,buttons,key)=>`<div data-key="${esc(key)}" style="display:flex;gap:12px;align-items:center;justify-content:space-between;background:#fff;border:1px solid #D9DFE2;border-left:5px solid #D3A24A;border-radius:8px;padding:10px 14px;box-shadow:0 6px 24px rgba(16,43,56,.16)"><div>${html}</div><div style="display:flex;gap:8px">${buttons}</div></div>`;
  function itemLabel(key,data){if(key.startsWith("p:")){const d=data||{};return "the proposal for "+(d.client&&d.client.name||d.prop&&d.prop.number||"a client")}return LABEL[key]||key}
  function renderBar(){
    if(!bar)return;let h="";
    if(st.reloadWanted&&st.conflicts.size)h+=card("Your choice to use the other version will load once you've decided the item"+(st.conflicts.size>1?"s":"")+" below.","","pending");
    st.conflicts.forEach((c,key)=>{const cur=c.current;
      if(c.kind==="delete")h+=card(`<strong>${esc(cur&&cur.updatedBy||"Someone")}</strong> changed ${esc(itemLabel(key,cur&&cur.data))} at ${esc(when(cur&&cur.updatedAt))}, after you deleted it.`,btn("Delete anyway","del:"+key,true)+btn("Keep their version","theirs:"+key),key);
      else if(!cur)h+=card(`Someone deleted ${esc(itemLabel(key,c.mine))} while you were editing it.`,btn("Save mine again","mine:"+key,true)+btn("Let it go","theirs:"+key),key);
      else h+=card(`<strong>${esc(cur.updatedBy||"Someone")}</strong> saved a newer version of ${esc(itemLabel(key,cur.data))} at ${esc(when(cur.updatedAt))} while you were editing.`,btn("Keep mine","mine:"+key,true)+btn("Use theirs","theirs:"+key),key)});
    if(st.signedOut)h+=card("Your sign-in has expired, so changes can't be saved. Reload to sign in again; changes made since the last save will be lost.",btn("Reload","reload",true),"signout");
    else if(st.retry)h+=card(`Your last change hasn't been saved — the server can't be reached. Retrying automatically.${st.lastErr?` <span style="color:#6B7A82">(${esc(st.lastErr)})</span>`:""}`,btn("Retry now","retry",true),"retry");
    if(st.errors.size)h+=card(`${st.errors.size===1?"One change was":st.errors.size+" changes were"} refused by the server and not saved${st.errText?`: ${esc(st.errText)}`:""}. Edit the item again to retry, or contact whoever maintains the app.`,btn("Dismiss","dismiss"),"errors");
    if(st.remote&&!st.conflicts.size)h+=card(`${esc(st.remote)} saved changes since you opened the app.`,btn("Refresh","refresh",true)+btn("Later","later"),"remote");
    bar.innerHTML=h;
  }
  document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("#plNotice button[data-act]");if(!b)return;
    const [act,...rest]=b.dataset.act.split(":"),key=rest.join(":");const c=st.conflicts.get(key);
    if(act==="mine"&&c){c.target.etag=c.current?c.current.etag:null;st.conflicts.delete(key);st.dirty.add(c.doc);flushNow()}
    else if(act==="theirs"&&c){/* keep the other version: stop re-sending ours, then reload from the server */
      c.target.json=c.doc==="proposals"?(c.mine?strip(c.mine):c.target.json):localStorage.getItem(K[c.doc]);
      if(c.kind==="delete"){delete st.props[key.slice(2)]} /* keep theirs: stop trying to delete it */
      st.conflicts.delete(key);st.reloadWanted=true}
    else if(act==="del"&&c){c.target.etag=c.current?c.current.etag:null;st.conflicts.delete(key);st.dirty.add("proposals");flushNow()}
    else if(act==="retry"){st.retry=0;flushNow()}
    else if(act==="refresh"){flushThen(reload)}
    else if(act==="later"){st.remote=null;st.snoozeUntil=Date.now()+10*60*1000;status()}
    else if(act==="reload"){reload()}
    else if(act==="dismiss"){st.errors.clear();st.errText=""}
    /* "Use theirs" needs a reload; wait until every other decision on screen has been made */
    if(st.reloadWanted&&!st.conflicts.size){st.reloadWanted=false;flushThen(reload)}
    status()});

  /* ---------- talking to the server ---------- */
  async function api(method,url,body){
    let r;
    const payload=body?JSON.stringify(body):undefined;
    try{r=await fetch(url,{method,credentials:"same-origin",cache:"no-store",redirect:"manual",keepalive:method!=="GET"&&(!payload||payload.length<60000),headers:{"Content-Type":"application/json","X-PL-Client":"1"},body:payload})}
    catch(e){const err=new Error("network");err.network=true;throw err}
    if(r.type==="opaqueredirect"||r.status===401){st.signedOut=true;const err=new Error("signed out");err.signedOut=true;throw err}
    const j=await r.json().catch(()=>({}));
    if(r.status===409)return {conflict:true,current:j.current||null};
    if(r.status>=400&&r.status<500)return {rejected:true,error:j.error||("HTTP "+r.status)};
    if(!r.ok){const err=new Error(j.error||("HTTP "+r.status));err.server=true;throw err}
    return j;
  }

  async function flushDoc(name){
    const raw=st.local[name];if(raw==null)return;
    const t=st.docs[name];if(raw===t.json||st.conflicts.has(name)||st.errors.get(name)===raw)return;
    const r=await api("PUT","/api/docs/"+name,{data:JSON.parse(raw),etag:t.etag});
    if(r.rejected){st.errors.set(name,raw);st.errText=r.error;return}
    if(r.conflict){
      if(r.current&&JSON.stringify(r.current.data)===raw){t.etag=r.current.etag;t.json=raw;return} /* our own earlier save; its reply was lost */
      st.conflicts.set(name,{doc:name,target:t,current:r.current,mine:JSON.parse(raw)});return}
    st.errors.delete(name);t.etag=r.etag;t.json=raw;
  }
  async function flushProps(){
    let arr;try{arr=JSON.parse(st.local.proposals||"[]")}catch(_){return}
    const seen=new Set();
    for(const p of arr){if(!p||!p.id)continue;seen.add(p.id);
      const key="p:"+p.id,json=strip(p),t=st.props[p.id]||(st.props[p.id]={etag:null,json:null});
      if(t.json===json||st.conflicts.has(key)||st.errors.get(key)===json)continue;
      const r=await api("PUT","/api/proposals/"+encodeURIComponent(p.id),{data:JSON.parse(json),etag:t.etag});
      if(r.rejected){st.errors.set(key,json);st.errText=r.error;continue}
      if(r.conflict){
        if(r.current&&strip(r.current.data)===json){t.etag=r.current.etag;t.json=json;continue} /* our own earlier save; its reply was lost */
        st.conflicts.set(key,{doc:"proposals",target:t,current:r.current,mine:p});continue}
      st.errors.delete(key);t.etag=r.etag;t.json=json;
      try{const list=(typeof P!=="undefined"&&Array.isArray(P))?P:[];const o=list.find(x=>x.id===p.id);if(o){o.savedBy=r.updatedBy;o.savedAt=r.updatedAt}}catch(_){}
    }
    for(const id of Object.keys(st.props)){if(seen.has(id))continue;const key="p:"+id,t=st.props[id];
      if(st.conflicts.has(key))continue;
      if(!t.etag&&t.json===null){delete st.props[id];continue}
      const r=await api("DELETE","/api/proposals/"+encodeURIComponent(id)+(t.etag?"?etag="+encodeURIComponent(t.etag):""));
      if(r.conflict){st.conflicts.set(key,{doc:"proposals",kind:"delete",target:t,current:r.current});continue}
      delete st.props[id];
    }
  }
  async function flush(){
    clearTimeout(st.timer);st.timer=0;
    if(st.busy){st.again=true;return}
    if(st.signedOut||!st.dirty.size){done();return}
    st.busy=true;status();
    const names=[...st.dirty];st.dirty.clear();
    try{
      for(const n of names){if(n==="proposals")await flushProps();else await flushDoc(n)}
      st.retry=0;st.lastErr="";
    }catch(e){
      names.forEach(n=>st.dirty.add(n));
      if(!e.signedOut){st.retry=Math.min((st.retry||2.5)*2,60);st.lastErr=e.network?"":e.message;st.timer=setTimeout(flush,st.retry*1000)}
    }finally{st.busy=false}
    if(st.again){st.again=false;return flush()}
    status();done();
  }
  function done(){if(st.busy||st.dirty.size||st.timer)return;const w=st.waiters.splice(0);w.forEach(f=>f())}
  function schedule(){clearTimeout(st.timer);st.timer=setTimeout(flush,600);status()}
  function flushNow(){clearTimeout(st.timer);st.timer=0;flush()}
  function flushThen(cb){st.waiters.push(cb);flushNow()}
  const reload=()=>{st.leaving=true;location.reload()};

  /* ---------- notice when other people save ---------- */
  async function checkRemote(){
    if(document.visibilityState!=="visible"||st.busy||st.signedOut||(st.snoozeUntil&&Date.now()<st.snoozeUntil))return;
    let v;try{v=await api("GET","/api/versions")}catch(_){return}
    const who=new Set();
    for(const [k,x] of Object.entries(v)){
      let m=k.match(/^docs\/(\w+)\.json$/);if(m){const t=st.docs[m[1]];if(t&&t.etag!==x.etag&&!st.dirty.has(m[1]))who.add(x.by||"Someone");continue}
      m=k.match(/^proposals\/(.+)\.json$/);if(m){const t=st.props[m[1]];if((!t||t.etag!==x.etag)&&!st.dirty.has("proposals"))who.add(x.by||"Someone")}
    }
    for(const id of Object.keys(st.props)){if(st.props[id].etag&&!v["proposals/"+id+".json"]&&!st.dirty.has("proposals"))who.add("Someone")}
    const meName=st.me&&st.me.name;who.delete(meName);
    const names=[...who];st.remote=names.length?(names.length>2?names.slice(0,2).join(", ")+" and others":names.join(" and ")):null;status();
  }

  /* ---------- boot ---------- */
  (async function boot(){
    let s;
    try{s=await api("GET","/api/state")}
    catch(e){
      if(e.signedOut)return fatal("You're not signed in, or your sign-in has expired.<br><span style='color:#6B7A82;font-size:13px'>Reload to sign in with your PetroLedger Microsoft account. If this keeps happening, Microsoft sign-in may not be set up for this web app yet.</span>","Sign in");
      return fatal("PetroLedger data couldn't be loaded"+(e.network?" — check your connection.":": "+esc(e.message))+"<br><span style='color:#6B7A82;font-size:13px'>Nothing was changed.</span>")}
    st.me=s.me;window.PL_ME=Object.assign({},s.me,{appService:!!s.appService});
    for(const n of ["catalog","settings","actions"]){const d=s.docs[n];
      if(d){const json=JSON.stringify(d.data);lsSet(K[n],json);st.local[n]=json;st.docs[n]={etag:d.etag,json}}else{localStorage.removeItem(K[n]);st.local[n]=null;st.docs[n]={etag:null,json:null}}}
    const list=(s.proposals||[]).filter(x=>x&&x.data&&x.data.id).map(x=>{st.props[x.data.id]={etag:x.etag,json:strip(x.data)};return Object.assign({},x.data,{savedBy:x.updatedBy,savedAt:x.updatedAt})});
    st.local.proposals=JSON.stringify(list);lsSet(K.proposals,st.local.proposals);
    Storage.prototype.setItem=function(k,v){origSet.call(this,k,v);if(this===localStorage&&DOC_OF[k]){st.local[DOC_OF[k]]=String(v);st.dirty.add(DOC_OF[k]);schedule()}};
    window.PL_SYNC={flushThen,flushNow,get pending(){return st.dirty.size>0||st.busy||st.conflicts.size>0}};
    try{run()}finally{
      /* The app tidies data as it opens (defaults, upgrades). Treat that as the saved state, so
         opening the app never saves on anyone's behalf; the tidied version goes up with the next real edit. */
      clearTimeout(st.timer);st.timer=0;st.dirty.clear();
      for(const n of ["catalog","settings","actions"]){const raw=st.local[n];if(raw!=null)st.docs[n].json=raw}
      try{for(const p of JSON.parse(st.local.proposals||"[]")){if(p&&st.props[p.id])st.props[p.id].json=strip(p)}}catch(_){}
      ov.remove();status()}
    window.addEventListener("beforeunload",e=>{if(st.leaving)return;if(st.dirty.size||st.busy||st.timer||st.conflicts.size){flushNow();e.preventDefault();e.returnValue=""}});
    setInterval(checkRemote,45000);
    window.addEventListener("focus",()=>setTimeout(checkRemote,500));
  })();
})();
</script>
</body>
